<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Alvion Admin — O'quv Markazi</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="shortcut icon" href="./favicon.svg">
  
  <!-- Telegram WebApp Script -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">

  <!-- CSS -->
  <link rel="stylesheet" href="./css/variables.css?v=4">
  <link rel="stylesheet" href="./css/base.css?v=4">
  <link rel="stylesheet" href="./css/components.css?v=6">
  <link rel="stylesheet" href="./css/layout.css?v=4">
  <link rel="stylesheet" href="./css/pages.css?v=5">
  <link rel="stylesheet" href="./css/mobile-nav.css?v=1">
</head>
<body>

  <!-- ================= LOGIN PAGE ================= -->
  <div class="login-container" id="login-page">
    <div class="login-card">
        <div class="login-header">
          <div class="login-logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none">
              <defs>
                <linearGradient id="logo-bg" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" style="stop-color:#1a2a5e"/>
                  <stop offset="100%" style="stop-color:#0f1a3d"/>
                </linearGradient>
              </defs>
              <rect width="40" height="40" rx="10" fill="url(#logo-bg)"/>
              <path d="M9 31 L15.5 11 L20 11 L14 31Z" fill="white" fill-opacity="0.95"/>
              <path d="M31 31 L24.5 11 L20 11 L26 31Z" fill="white" fill-opacity="0.95"/>
              <path d="M20 11 L26 31 L23.5 31 L17.5 16Z" fill="#c9a84c" fill-opacity="0.9"/>
              <path d="M11.5 22 L28.5 22 L27.8 24 L12.2 24Z" fill="white" fill-opacity="0.85"/>
              <path d="M5 33.5 Q20 31 35 33.5" stroke="white" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.6"/>
            </svg>
          </div>
          <h2 class="login-title">Alvion</h2>
          <p class="login-subtitle">O'quv markazi boshqaruv paneliga xush kelibsiz</p>
        </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-phone">Telefon raqam</label>
          <div style="position: relative;">
            <div style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary);">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            </div>
            <input type="text" id="login-phone" class="form-input" required placeholder="+998 90 123 45 67" style="padding-left: 40px;">
          </div>
        </div>

        <div class="form-group mb-6">
          <label class="form-label" for="login-password">Parol</label>
          <div style="position: relative;">
            <div style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-tertiary);">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </div>
            <input type="password" id="login-password" class="form-input" required placeholder="••••••••" style="padding-left: 40px;">
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Tizimga kirish</button>
      </form>
    </div>
  </div>

  <!-- ================= APP LAYOUT ================= -->
  <div class="app-layout" id="app-layout" style="display: none;">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar-container"></aside>
    <div class="sidebar-mobile-overlay"></div>

    <!-- Main Content Area -->
    <div class="main-wrapper">
      <header class="header" id="header-container"></header>
      
      <main class="main-content" id="main-content">
        <!-- Dynamic content injected here -->
      </main>
    </div>
  </div>

  <!-- ================= BOTTOM NAVIGATION (Mobile/WebApp) ================= -->
  <nav class="bottom-nav" id="bottom-nav" style="display:none;">
    <div class="bottom-nav-inner">
      <button class="bottom-nav-item" id="bnav-dashboard" onclick="window.router.navigate('/dashboard')">
        <div class="bottom-nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></svg>
        </div>
        <span class="bottom-nav-label">Bosh</span>
      </button>
      <button class="bottom-nav-item" id="bnav-courses" onclick="window.router.navigate('/courses')">
        <div class="bottom-nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 6 8-4 8 4"/><path d="m18 10 4 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-8l4-2"/><path d="M14 22v-4a2 2 0 0 0-4 0v4"/><circle cx="12" cy="9" r="2"/></svg>
        </div>
        <span class="bottom-nav-label">Kurslar</span>
      </button>
      <button class="bottom-nav-item" id="bnav-applications" onclick="window.router.navigate('/applications')">
        <div class="bottom-nav-icon" style="position:relative">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><path d="m9 15 2 2 4-4"/></svg>
          <span class="bottom-nav-badge" id="bnav-app-badge">0</span>
        </div>
        <span class="bottom-nav-label">Arizalar</span>
      </button>
      <button class="bottom-nav-item" id="bnav-users" onclick="window.router.navigate('/users')">
        <div class="bottom-nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <span class="bottom-nav-label">Foydalanuvchilar</span>
      </button>
      <button class="bottom-nav-item" id="bnav-more" onclick="window.mobileNav.openMore()">
        <div class="bottom-nav-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </div>
        <span class="bottom-nav-label">Ko'proq</span>
      </button>
    </div>
  </nav>

  <!-- ================= MORE DRAWER ================= -->
  <div class="more-drawer-overlay" id="more-drawer-overlay" onclick="window.mobileNav.closeMore()"></div>
  <div class="more-drawer" id="more-drawer">
    <div class="more-drawer-handle"></div>
    <div class="more-drawer-title">Barcha bo'limlar</div>
    <div class="more-drawer-grid">
      <button class="more-drawer-item" onclick="window.mobileNav.goTo('/lessons')">
        <div class="drawer-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg></div>
        <span>Dars jadvali</span>
      </button>
      <button class="more-drawer-item" onclick="window.mobileNav.goTo('/teachers')">
        <div class="drawer-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><polyline points="16 11 18 13 22 9"/></svg></div>
        <span>O'qituvchilar</span>
      </button>
      <button class="more-drawer-item" onclick="window.mobileNav.goTo('/prices')">
        <div class="drawer-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="2"/><path d="M3 16V8a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2Z"/></svg></div>
        <span>Narxlar</span>
      </button>
      <button class="more-drawer-item" onclick="window.mobileNav.goTo('/news')">
        <div class="drawer-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <span>Yangiliklar</span>
      </button>
      <button class="more-drawer-item" onclick="window.mobileNav.goTo('/tests')">
        <div class="drawer-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg></div>
        <span>Testlar</span>
      </button>
      <button class="more-drawer-item" onclick="window.mobileNav.goTo('/broadcast')">
        <div class="drawer-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></div>
        <span>Xabar</span>
      </button>
      <button class="more-drawer-item" onclick="window.mobileNav.goTo('/settings')">
        <div class="drawer-icon-wrap"><svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></div>
        <span>Sozlamalar</span>
      </button>
    </div>
  </div>

  <script src="./js/utils/helpers.js?v=3"></script>

  <!-- Config: Backend URL (change this for production) -->
  <script src="./config.js?v=3"></script>

  <script src="./js/components/toast.js?v=3"></script>

  <!-- Pages -->
  <script src="./js/pages/dashboard.js?v=4"></script>

  <script src="./js/pages/lessons.js?v=4"></script>
  <script src="./js/pages/teachers.js?v=4"></script>
  <script src="./js/pages/prices.js?v=4"></script>
  <script src="./js/pages/news.js?v=6"></script>
  <script src="./js/pages/users.js?v=7"></script>
