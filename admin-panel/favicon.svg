<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a2a5e"/>
      <stop offset="100%" style="stop-color:#0f1a3d"/>
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a843"/>
      <stop offset="100%" style="stop-color:#c9a84c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg-grad)"/>
  <!-- "A" letter shape (like Alvion logo) -->
  <!-- Left leg of A -->
  <path d="M7 25 L13.5 8 L16 8 L10 25Z" fill="white" fill-opacity="0.95"/>
  <!-- Right leg of A -->
  <path d="M25 25 L18.5 8 L16 8 L22 25Z" fill="white" fill-opacity="0.95"/>
  <!-- Gold diagonal accent (like in Alvion logo) -->
  <path d="M16 8 L22 25 L19.5 25 L14.5 12Z" fill="url(#gold-grad)" fill-opacity="0.85"/>
  <!-- Crossbar of A -->
  <path d="M10.5 18.5 L21.5 18.5 L20.8 20.5 L11.2 20.5Z" fill="white" fill-opacity="0.9"/>
  <!-- Book lines at bottom -->
  <path d="M5 27 Q16 24.5 27 27" stroke="white" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.6"/>
  <path d="M5 28.5 Q16 26 27 28.5" stroke="white" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.4"/>
</svg>
